model_role = "deep_escalation"
dataset_version = "atrdf-dataset3-dataset4-v1"
feature_version = "http-deep-v1"
classes = ["BENIGN", "SQL_INJECTION", "XSS", "COOKIE_INJECTION", "DIRECTORY_TRAVERSAL", "REMOTE_CODE_EXECUTION"]
device = "auto"

[candidates.char_cnn]
epochs = 4
batch_size = 128
learning_rate = 0.001
max_length = 512
embedding_dimension = 48
filters = 64
dropout = 0.20

[candidates.distilbert]
pretrained_model = "distilbert-base-uncased"
epochs = 2
batch_size = 16
learning_rate = 0.00002
max_length = 256

