dataset_version = "cicids2018-flow-subset-v3"
non_finite_replacement = 0.0

sources = [
  "datasets/raw/cicids2018/Wednesday-14-02-2018_TrafficForML_CICFlowMeter.csv",
  "datasets/raw/cicids2018/Thursday-15-02-2018_TrafficForML_CICFlowMeter.csv",
  "datasets/raw/cicids2018/Friday-02-03-2018_TrafficForML_CICFlowMeter.csv",
]

features = [
  "Dst Port", "Protocol", "Flow Duration", "Tot Fwd Pkts", "Tot Bwd Pkts",
  "TotLen Fwd Pkts", "TotLen Bwd Pkts", "Fwd Pkt Len Max", "Fwd Pkt Len Mean",
  "Fwd Pkt Len Std", "Bwd Pkt Len Max", "Bwd Pkt Len Mean", "Bwd Pkt Len Std",
  "Flow Byts/s", "Flow Pkts/s", "Flow IAT Mean", "Flow IAT Std", "Flow IAT Max",
  "Flow IAT Min", "SYN Flag Cnt", "RST Flag Cnt", "PSH Flag Cnt", "ACK Flag Cnt",
  "Pkt Len Min", "Pkt Len Max", "Pkt Len Mean", "Pkt Len Std", "Down/Up Ratio",
  "Init Fwd Win Byts", "Init Bwd Win Byts", "Active Mean", "Active Std", "Active Max",
  "Active Min", "Idle Mean", "Idle Std", "Idle Max", "Idle Min",
]

[split]
train = 0.70
validation = 0.15
test = 0.15

[labels]
"Benign" = "BENIGN"
"FTP-BruteForce" = "BRUTE_FORCE"
"SSH-Bruteforce" = "BRUTE_FORCE"
"DoS attacks-GoldenEye" = "DOS_DDOS"
"DoS attacks-Slowloris" = "DOS_DDOS"
"Bot" = "BOT_ANOMALY"
