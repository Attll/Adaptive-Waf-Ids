server:
  port: 8080

spring:
  application:
    name: gateway-service
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
  cloud:
    gateway:
      routes:
        - id: demo-backend
          uri: ${DEMO_BACKEND_URL:http://127.0.0.1:8081}
          predicates:
            - Path=/backend/**
          filters:
            - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: health,info

adaptive-waf:
  detection:
    base-url: ${DETECTION_SERVICE_URL:http://127.0.0.1:8000}
    timeout: ${DETECTION_TIMEOUT:5s}
    max-body-bytes: ${DETECTION_MAX_BODY_BYTES:65536}
    path-prefix-to-strip: ${DETECTION_PATH_PREFIX_TO_STRIP:/backend}
  policy:
    block-risk-threshold: ${WAF_BLOCK_RISK_THRESHOLD:0.81}
  behaviour:
    short-window: ${BEHAVIOUR_SHORT_WINDOW:10s}
    medium-window: ${BEHAVIOUR_MEDIUM_WINDOW:60s}
    rate-limit-short-window: ${BEHAVIOUR_RATE_LIMIT_SHORT_WINDOW:40}
    temporary-block-threshold: ${BEHAVIOUR_TEMPORARY_BLOCK_THRESHOLD:40}
    temporary-block-duration: ${BEHAVIOUR_TEMPORARY_BLOCK_DURATION:60s}
    failed-auth-block-threshold: ${BEHAVIOUR_FAILED_AUTH_BLOCK_THRESHOLD:5}
    elevated-requests-per-short-window: ${LOAD_MODE_ELEVATED_REQUESTS:20}
    degraded-requests-per-short-window: ${LOAD_MODE_DEGRADED_REQUESTS:40}
    emergency-requests-per-short-window: ${LOAD_MODE_EMERGENCY_REQUESTS:80}
  events:
    enabled: ${SECURITY_EVENTS_ENABLED:true}
    exchange: ${SECURITY_EVENTS_EXCHANGE:adaptive.waf.events}
    queue-capacity: ${SECURITY_EVENTS_QUEUE_CAPACITY:500}
