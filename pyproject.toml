[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-waf"
version = "0.1.0"
description = "Adaptive web application firewall ML core"
requires-python = ">=3.11"
dependencies = ["ijson>=3.2,<4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
