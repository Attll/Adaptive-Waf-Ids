[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-waf"
version = "0.1.0"
description = "Adaptive web application firewall ML core"
requires-python = ">=3.11"
dependencies = [
  "ijson>=3.2,<4",
  "joblib>=1.4,<2",
  "scikit-learn>=1.5,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
