[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-waf"
version = "0.1.0"
description = "Adaptive web application firewall ML core"
requires-python = ">=3.11"
dependencies = [
  "ijson>=3.2,<4",
  "joblib>=1.4,<2",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
deep = [
  "torch>=2.7,<3",
  "transformers>=5,<6",
]
service = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.28,<1",
]
sensor = [
  "scapy>=2.5,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
