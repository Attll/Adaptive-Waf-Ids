name: adaptive-waf-phase5

services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: adaptive_waf
      POSTGRES_USER: adaptive_waf
      POSTGRES_PASSWORD: adaptive_waf_dev
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adaptive_waf -d adaptive_waf"]
      interval: 10s
      timeout: 5s
      retries: 12
