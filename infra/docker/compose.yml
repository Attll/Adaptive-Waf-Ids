# Explicit local demo: development credentials and operator-facing helper APIs; bind only to loopback.
name: adaptive-waf
services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 12
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: adaptive_waf, POSTGRES_USER: adaptive_waf, POSTGRES_PASSWORD: adaptive_waf_dev }
    # Published on 55432 so an external client such as DBeaver can inspect the journal directly.
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adaptive_waf -d adaptive_waf"]
      interval: 5s
      timeout: 3s
      retries: 12
  detection:
    build: { context: ../.., dockerfile: detection-service/Dockerfile }
    # The escalation worker reports revised verdicts back to the control plane.
    environment: { CONTROL_SERVICE_URL: http://control:8082, WAF_INTERNAL_TOKEN: "${WAF_INTERNAL_TOKEN:-local-demo-only}" }
    ports: ["127.0.0.1:8000:8000"]
  gateway:
    build: { context: ../../gateway-service, dockerfile: Dockerfile }
    environment: { REDIS_HOST: redis, RABBITMQ_HOST: rabbitmq, DETECTION_SERVICE_URL: http://detection:8000, CONTROL_SERVICE_URL: http://control:8082, DEMO_BACKEND_URL: http://demo:8081, WAF_INTERNAL_TOKEN: "${WAF_INTERNAL_TOKEN:-local-demo-only}" }
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      detection: { condition: service_started }
  demo:
    build: { context: ../../demo-backend, dockerfile: Dockerfile }
  control:
    build: { context: ../../security-control-service, dockerfile: Dockerfile }
    environment: { WAF_POSTGRES_URL: jdbc:postgresql://postgres:5432/adaptive_waf, REDIS_HOST: redis, RABBITMQ_HOST: rabbitmq, WAF_INTERNAL_TOKEN: "${WAF_INTERNAL_TOKEN:-local-demo-only}" }
    ports: ["127.0.0.1:8082:8082"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
  sensor:
    build: { context: ../.., dockerfile: network-sensor/Dockerfile }
    environment: { REDIS_HOST: redis }
    ports: ["127.0.0.1:8083:8083"]
    depends_on:
      redis: { condition: service_healthy }
  adaptation:
    build: { context: ../.., dockerfile: training-adaptation-service/Dockerfile }
    environment: { CONTROL_SERVICE_URL: http://control:8082, WAF_INTERNAL_TOKEN: "${WAF_INTERNAL_TOKEN:-local-demo-only}" }
    ports: ["127.0.0.1:8084:8084"]
  dashboard:
    build: { context: ../.., dockerfile: dashboard/Dockerfile }
    ports: ["127.0.0.1:3000:80"]
    depends_on: [control, gateway, detection, sensor, adaptation]
  crs:
    image: owasp/modsecurity-crs:nginx
    environment: { BACKEND: http://gateway:8080, SERVER_NAME: localhost, PORT: "8080", MODSEC_RULE_ENGINE: "on" }
    ports: ["127.0.0.1:8090:8080"]

volumes:
  postgres-data:
