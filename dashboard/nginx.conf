map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  root /usr/share/nginx/html;

  # Service credentials must never be accepted through the browser proxy surface.
  location ~ ^/(control-api|control-ws|gateway-api|detection-api|sensor-api|adaptation-api)/internal(?:/|$) { return 404; }

  location /control-api/ {
    client_max_body_size 3m;
    proxy_pass http://control:8082/;
    proxy_hide_header WWW-Authenticate;
  }

  location /control-ws/ {
    proxy_pass http://control:8082/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  location /gateway-api/ {
    proxy_pass http://gateway:8080/;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /detection-api/ { proxy_pass http://detection:8000/; }
  location /sensor-api/ { proxy_pass http://sensor:8083/; }
  location /adaptation-api/ { proxy_pass http://adaptation:8084/; }
  location / { try_files $uri $uri/ /index.html; }
}
