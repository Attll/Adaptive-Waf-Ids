server:
  port: 8082

spring:
  application:
    name: security-control-service
  datasource:
    url: ${WAF_POSTGRES_URL:jdbc:postgresql://127.0.0.1:55432/adaptive_waf}
    username: ${WAF_POSTGRES_USER:adaptive_waf}
    password: ${WAF_POSTGRES_PASSWORD:adaptive_waf_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    listener:
      simple:
        default-requeue-rejected: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info

adaptive-waf:
  control:
    admin:
      username: ${WAF_ADMIN_USERNAME:admin}
      initial-password: ${WAF_ADMIN_INITIAL_PASSWORD:adaptive_waf_dev}
    blocks:
      default-duration: ${WAF_MANUAL_BLOCK_DURATION:1h}
    database:
      # Reported to the console so an operator can point an external client at the journal.
      external-url: ${WAF_POSTGRES_EXTERNAL_URL:jdbc:postgresql://127.0.0.1:55432/adaptive_waf}
