server:
  port: 8082

spring:
  application:
    name: security-control-service
  datasource:
    url: ${WAF_POSTGRES_URL:jdbc:postgresql://127.0.0.1:55432/adaptive_waf}
    username: ${WAF_POSTGRES_USER:adaptive_waf}
    password: ${WAF_POSTGRES_PASSWORD:adaptive_waf_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    listener:
      simple:
        default-requeue-rejected: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
